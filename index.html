<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질문 생성 레시피 코치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #0EA5A0;
    --mint-light: #E0F5F4;
    --mint-mid: #6DD4D0;
    --yellow: #FFD600;
    --yellow-light: #FFFBE0;
    --navy: #1A2340;
    --navy-mid: #3B4A6B;
    --bg: #F0F5F5;
    --white: #FFFFFF;
    --grey-light: #EEF2F2;
    --grey-mid: #C5D0D0;
    --text-body: #2E3A4A;
    --r1: #FF7043; --r1-light: #FFF0EB;
    --r2: #7C4DFF; --r2-light: #F3EEFF;
    --r3: #0EA5A0; --r3-light: #E0F5F4;
    --r4: #F59E0B; --r4-light: #FFFBE6;
    --radius: 18px;
    --shadow: 0 2px 20px rgba(10,40,60,0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-body);
    font-size: 18px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--navy);
    color: var(--white);
    padding: 22px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 14px rgba(0,0,0,0.22);
    flex-shrink: 0;
  }
  .logo-badge {
    background: var(--yellow);
    color: var(--navy);
    font-weight: 900;
    font-size: 17px;
    padding: 7px 16px;
    border-radius: 9px;
    letter-spacing: -0.3px;
  }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header .sub { font-size: 16px; color: var(--mint-mid); margin-left: auto; }

  /* LAYOUT — 화면 꽉 채우기 */
  .app-shell {
    display: flex;
    flex: 1;
    width: 100%;
    padding: 28px 32px;
    gap: 28px;
    min-height: 0;
  }

  /* SIDEBAR */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sidebar-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy-mid);
    letter-spacing: 0.7px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  /* 모드 토글 */
  .mode-toggle {
    background: var(--white);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .mode-radio { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .mode-radio label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    color: var(--navy-mid);
    padding: 14px 18px;
    border-radius: 12px;
    border: 2.5px solid transparent;
    transition: all 0.15s;
  }
  .mode-radio label:hover { background: var(--grey-light); }
  .mode-radio input[type=radio] { accent-color: var(--mint); width: 20px; height: 20px; }
  .mode-radio label.selected { border-color: var(--mint); background: var(--mint-light); color: var(--navy); font-weight: 700; }

  /* 레시피 버튼 */
  .recipe-btn {
    border: none;
    border-radius: 14px;
    padding: 20px 22px;
    cursor: pointer;
    text-align: left;
    background: var(--white);
    box-shadow: var(--shadow);
    transition: all 0.17s;
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .recipe-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    border-radius: 14px 0 0 14px;
  }
  .recipe-btn.r1::before { background: var(--r1); }
  .recipe-btn.r2::before { background: var(--r2); }
  .recipe-btn.r3::before { background: var(--r3); }
  .recipe-btn.r4::before { background: var(--r4); }
  .recipe-btn .rnum { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .recipe-btn.r1 .rnum { color: var(--r1); }
  .recipe-btn.r2 .rnum { color: var(--r2); }
  .recipe-btn.r3 .rnum { color: var(--r3); }
  .recipe-btn.r4 .rnum { color: var(--r4); }
  .recipe-btn .rtitle { font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .recipe-btn .rdesc { font-size: 14px; color: var(--navy-mid); margin-top: 5px; line-height: 1.5; }
  .recipe-btn:hover { transform: translateX(3px); box-shadow: 0 5px 20px rgba(10,40,60,0.14); }
  .recipe-btn.active.r1 { background: var(--r1-light); }
  .recipe-btn.active.r2 { background: var(--r2-light); }
  .recipe-btn.active.r3 { background: var(--r3-light); }
  .recipe-btn.active.r4 { background: var(--r4-light); }

  /* MAIN */
  .main-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
  }

  /* 레시피 설명바 */
  .recipe-info-bar {
    border-radius: var(--radius);
    padding: 24px 28px;
    background: var(--white);
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-start;
    gap: 18px;
    border-left: 7px solid var(--mint);
    transition: border-color 0.2s;
  }
  .recipe-info-bar .emoji { font-size: 40px; flex-shrink: 0; }
  .recipe-info-bar h2 { font-size: 23px; font-weight: 700; color: var(--navy); margin-bottom: 7px; }
  .recipe-info-bar p { font-size: 17px; color: var(--navy-mid); line-height: 1.75; }
  .recipe-info-bar .tip {
    margin-top: 10px;
    font-size: 15px;
    background: var(--yellow-light);
    border-radius: 9px;
    padding: 7px 14px;
    color: #7A6000;
    display: inline-block;
    line-height: 1.6;
  }

  /* 입력 블록 */
  .input-block {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    flex: 1;
  }
  .input-block label {
    display: block;
    font-size: 19px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 14px;
  }
  .topic-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .topic-row input {
    flex: 1;
    border: 2.5px solid var(--grey-mid);
    border-radius: 12px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: 18px;
    outline: none;
    color: var(--navy);
    transition: border-color 0.14s;
    background: #FAFCFC;
  }
  .topic-row input:focus { border-color: var(--mint); background: var(--white); }
  textarea {
    width: 100%;
    border: 2.5px solid var(--grey-mid);
    border-radius: 12px;
    padding: 18px 20px;
    font-family: inherit;
    font-size: 18px;
    min-height: 160px;
    resize: vertical;
    line-height: 1.8;
    outline: none;
    color: var(--navy);
    transition: border-color 0.14s;
    background: #FAFCFC;
  }
  textarea:focus { border-color: var(--mint); background: var(--white); }
  .char-count { font-size: 14px; color: var(--grey-mid); text-align: right; margin-top: 7px; }

  .btn-primary {
    background: var(--mint);
    color: var(--white);
    border: none;
    border-radius: 14px;
    padding: 18px 44px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.17s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
  }
  .btn-primary:hover { background: #0C9490; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(14,165,160,0.38); }
  .btn-primary:disabled { background: var(--grey-mid); cursor: not-allowed; transform: none; box-shadow: none; }

  /* RESULT */
  .result-area {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.28s ease;
    display: none;
  }
  .result-area.visible { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header { margin-bottom: 20px; }
  .result-header h3 { font-size: 22px; font-weight: 700; color: var(--navy); }

  .score-ring {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--grey-light);
    border-radius: 16px;
    padding: 18px 24px;
    margin-bottom: 20px;
  }
  .score-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900;
    flex-shrink: 0;
    border-width: 4px;
    border-style: solid;
  }
  .score-text { font-size: 17px; color: var(--navy-mid); line-height: 1.7; }
  .score-text strong { font-size: 21px; color: var(--navy); display: block; margin-bottom: 3px; }

  .feedback-section { margin-bottom: 16px; border-radius: 14px; overflow: hidden; }
  .fb-head { font-size: 17px; font-weight: 700; padding: 12px 18px; display: flex; align-items: center; gap: 8px; }
  .fb-body { font-size: 18px; line-height: 1.85; padding: 16px 18px; color: var(--text-body); }
  .fb-good .fb-head { background: #ECFDF5; color: #065F46; }
  .fb-good .fb-body { background: #F9FFFE; }
  .fb-improve .fb-head { background: #FFF7ED; color: #92400E; }
  .fb-improve .fb-body { background: #FFFBF7; }
  .fb-revised .fb-head { background: var(--mint-light); color: #065050; }
  .fb-revised .fb-body { background: #F2FFFE; font-weight: 600; }
  .fb-generated .fb-head { background: var(--r2-light); color: #4A00A0; }
  .fb-generated .fb-body { background: #F8F4FF; }

  .question-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--grey-light);
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .question-item:last-child { border-bottom: none; }
  .q-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .q-text { font-size: 18px; line-height: 1.75; color: var(--navy); }

  /* LOADING */
  .loading-wrap { display: flex; flex-direction: column; align-items: center; padding: 48px; gap: 18px; }
  .spinner {
    width: 50px; height: 50px;
    border: 5px solid var(--mint-light);
    border-top-color: var(--mint);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { font-size: 18px; color: var(--navy-mid); }

  /* HISTORY */
  .history-area { background: var(--white); border-radius: var(--radius); padding: 22px 28px; box-shadow: var(--shadow); }
  .history-area h3 { font-size: 17px; font-weight: 700; color: var(--navy-mid); margin-bottom: 14px; }
  .history-item {
    border: 2px solid var(--grey-light);
    border-radius: 11px;
    padding: 13px 18px;
    font-size: 15px;
    color: var(--navy-mid);
    cursor: pointer;
    transition: all 0.13s;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 9px;
  }
  .history-item:hover { border-color: var(--mint); color: var(--navy); background: var(--mint-light); }
  .h-recipe { font-weight: 700; }
  .h-q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <span class="logo-badge">질문 레시피</span>
  <h1>AI 질문 코치</h1>
  <span class="sub">좋은 질문이 좋은 배움을 만듭니다 ✨</span>
</header>

<div class="app-shell">
  <!-- 사이드바 -->
  <div class="sidebar">
    <!-- 모드 선택 (맨 위) -->
    <div class="mode-toggle">
      <div class="sidebar-label">모드 선택</div>
      <div class="mode-radio">
        <label class="selected" id="label-feedback">
          <input type="radio" name="mode" value="feedback" checked onchange="switchMode('feedback')">
          🔍 내 질문 평가받기
        </label>
        <label id="label-generate">
          <input type="radio" name="mode" value="generate" onchange="switchMode('generate')">
          ✨ 질문 생성하기
        </label>
        <label id="label-prompt">
          <input type="radio" name="mode" value="prompt" onchange="switchMode('prompt')">
          🤖 AI 프롬프트 만들기
        </label>
      </div>
    </div>

    <!-- 레시피 선택 -->
    <div class="sidebar-label" style="margin-top:4px;">레시피 선택</div>
    <button class="recipe-btn r1 active" onclick="selectRecipe(1)">
      <div class="rnum">RECIPE 1</div>
      <div class="rtitle">5W1H 변형하기</div>
      <div class="rdesc">"만약에(if)"로 상상력 질문</div>
    </button>
    <button class="recipe-btn r2" onclick="selectRecipe(2)">
      <div class="rnum">RECIPE 2</div>
      <div class="rtitle">5-Why 기법</div>
      <div class="rdesc">본질을 파고드는 왜? 연쇄</div>
    </button>
    <button class="recipe-btn r3" onclick="selectRecipe(3)">
      <div class="rnum">RECIPE 3</div>
      <div class="rtitle">Q-Matrix 기법</div>
      <div class="rdesc">가로×세로 조합 고차원 질문</div>
    </button>
    <button class="recipe-btn r4" onclick="selectRecipe(4)">
      <div class="rnum">RECIPE 4</div>
      <div class="rtitle">열린 질문 만들기</div>
      <div class="rdesc">닫힌 → 열린 질문으로 전환</div>
    </button>
  </div>

  <!-- 메인 패널 -->
  <div class="main-panel">
    <!-- 레시피 설명 -->
    <div class="recipe-info-bar" id="infoBar">
      <div class="emoji" id="infoEmoji">🔀</div>
      <div>
        <h2 id="infoTitle">레시피 1 · 5W1H 변형하기</h2>
        <p id="infoDesc">who / when / where / what / why / how 중 하나를 골라, <strong>"만약에(if)"</strong>를 추가해 상상력 질문으로 바꾸는 기법입니다.</p>
        <span class="tip" id="infoTip">💡 예: "이순신 장군은 누구인가요?" → "만약 이순신 장군에게 거북선이 없었다면 전쟁은 어떻게 달라졌을까요?"</span>
      </div>
    </div>

    <!-- 입력 영역 -->
    <div class="input-block">
      <div id="topicRow" class="topic-row" style="display:none;">
        <input type="text" id="topicInput" placeholder="주제나 키워드를 입력하세요 (예: 기후변화, 스마트폰 중독…)" maxlength="80">
      </div>
      <div id="feedbackInputWrap">
        <label for="questionInput">✏️ 내가 만든 질문을 입력하세요</label>
        <textarea id="questionInput" placeholder="여기에 질문을 써보세요…" maxlength="300" oninput="updateChar()"></textarea>
        <div class="char-count"><span id="charCount">0</span> / 300</div>
      </div>
      <div id="generateInputWrap" style="display:none;">
        <label>✨ 위에 주제를 입력하면 AI가 레시피에 맞는 질문을 생성해드려요</label>
      </div>
      <div id="promptInputWrap" style="display:none;">
        <label for="promptInput">🤖 AI에게 보내고 싶은 문장을 입력하세요</label>
        <textarea id="promptInput" placeholder="예: 좋은 책 추천해줘 / 주말에 뭐 할지 알려줘 / 동물은 뭐가 있어?" maxlength="300" oninput="updatePromptChar()"></textarea>
        <div class="char-count"><span id="promptCharCount">0</span> / 300</div>
      </div>

      <!-- 3단계 진행 영역 (프롬프트 모드 전용) -->
      <div id="promptStepsWrap" style="display:none;">
        <!-- 진행 표시 바 -->
        <div style="display:flex;gap:0;margin-bottom:24px;border-radius:12px;overflow:hidden;">
          <div id="stepBar1" style="flex:1;padding:12px;text-align:center;font-size:15px;font-weight:700;background:#EFF6FF;color:#1D4ED8;border-right:2px solid white;">① 명확하게</div>
          <div id="stepBar2" style="flex:1;padding:12px;text-align:center;font-size:15px;font-weight:700;background:var(--grey-light);color:var(--grey-mid);border-right:2px solid white;">② 구체적으로</div>
          <div id="stepBar3" style="flex:1;padding:12px;text-align:center;font-size:15px;font-weight:700;background:var(--grey-light);color:var(--grey-mid);">③ 목적 분명히</div>
        </div>

        <!-- 원본 문장 표시 -->
        <div style="background:var(--grey-light);border-radius:12px;padding:16px 20px;margin-bottom:20px;">
          <div style="font-size:14px;font-weight:700;color:var(--navy-mid);margin-bottom:6px;">📝 내 원래 문장</div>
          <div id="originalPromptDisplay" style="font-size:18px;color:var(--navy);font-weight:500;"></div>
        </div>

        <!-- 단계별 콘텐츠 -->
        <div id="stepContent"></div>
      </div>
      <button class="btn-primary" id="runBtn" onclick="runAI()">
        <span id="btnIcon">🔍</span> <span id="btnText">질문 평가하기</span>
      </button>
    </div>

    <!-- 결과 영역 -->
    <div class="result-area" id="resultArea">
      <div id="resultContent"></div>
    </div>

    <!-- 히스토리 -->
    <div class="history-area" id="historyArea" style="display:none;">
      <h3>📋 이번 세션 기록</h3>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://sunchangq-production.up.railway.app';

  const RECIPES = {
    1: { emoji: '🔀', color: 'var(--r1)', title: '레시피 1 · 5W1H 변형하기', desc: 'who / when / where / what / why / how 중 하나를 골라, <strong>"만약에(if)"</strong>를 추가해 상상력 질문으로 바꾸는 기법입니다.', tip: '💡 예: "이순신 장군은 누구인가요?" → "만약 이순신 장군에게 거북선이 없었다면 전쟁은 어떻게 달라졌을까요?"' },
    2: { emoji: '🔎', color: 'var(--r2)', title: '레시피 2 · 5-Why 기법', desc: '현상의 표면이 아니라 <strong>본질적 이유</strong>를 파고들어 봅니다. "왜?"를 5번 반복하며 더 깊은 질문으로 나아가는 기법입니다.', tip: '💡 예: "왜 친구들의 소식이 궁금할까?" → "왜 불안감을 느낄까?" → "왜 자꾸 SNS에 접속할까?" …' },
    3: { emoji: '⊞', color: 'var(--r3)', title: '레시피 3 · Q-Matrix 기법', desc: '<strong>가로축(사실/예측·상상/가치·판단)</strong> × <strong>세로축(WHAT/WHO/HOW/WHY)</strong>를 조합해 수준 높은 질문을 만드는 기법입니다.', tip: '💡 표에서 단어 두 개만 골라봐, 오른쪽 아래로 갈수록 사고력 점수는 올라가!' },
    4: { emoji: '🔓', color: 'var(--r4)', title: '레시피 4 · 열린 질문 만들기', desc: '닫힌 자물쇠(네/아니오) 질문을 열린 열쇠(다양한 생각) 질문으로 바꾸는 기법입니다. <strong>정답이 하나가 아닌 질문</strong>을 만들어보세요.', tip: '💡 "세종대왕은 백성을 아꼈나요?" → "세종대왕이 한글을 창제할 때 가장 중요하게 생각한 가치는 무엇이며 오늘날 우리에게 어떤 의미가 있을까요?"' }
  };

  let currentRecipe = 1;
  let currentMode = 'feedback';
  let history = [];

  function selectRecipe(n) {
    currentRecipe = n;
    document.querySelectorAll('.recipe-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.recipe-btn')[n - 1].classList.add('active');
    const r = RECIPES[n];
    document.getElementById('infoEmoji').textContent = r.emoji;
    document.getElementById('infoTitle').textContent = r.title;
    document.getElementById('infoDesc').innerHTML = r.desc;
    document.getElementById('infoTip').textContent = r.tip;
    document.getElementById('infoBar').style.borderLeftColor = r.color;
    hideResult();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('feedbackInputWrap').style.display = mode === 'feedback' ? 'block' : 'none';
    document.getElementById('generateInputWrap').style.display = mode === 'generate' ? 'block' : 'none';
    document.getElementById('promptInputWrap').style.display = mode === 'prompt' ? 'block' : 'none';
    document.getElementById('topicRow').style.display = mode === 'generate' ? 'flex' : 'none';
    document.getElementById('btnIcon').textContent = mode === 'feedback' ? '🔍' : mode === 'generate' ? '✨' : '🤖';
    document.getElementById('btnText').textContent = mode === 'feedback' ? '질문 평가하기' : mode === 'generate' ? '질문 생성하기' : '프롬프트 분석하기';
    document.querySelectorAll('.mode-radio label').forEach(l => l.classList.remove('selected'));
    const labelId = mode === 'feedback' ? 'label-feedback' : mode === 'generate' ? 'label-generate' : 'label-prompt';
    document.getElementById(labelId).classList.add('selected');
    hideResult();
  }

  function updateChar() {
    document.getElementById('charCount').textContent = document.getElementById('questionInput').value.length;
  }

  function updatePromptChar() {
    document.getElementById('promptCharCount').textContent = document.getElementById('promptInput').value.length;
  }

  function hideResult() {
    document.getElementById('resultArea').classList.remove('visible');
  }

  function showLoading() {
    document.getElementById('resultArea').classList.add('visible');
    document.getElementById('resultContent').innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>AI 코치가 분석 중이에요…</p></div>';
  }

  function scoreColor(s) {
    if (s >= 85) return '#059669';
    if (s >= 70) return '#0EA5A0';
    if (s >= 55) return '#F59E0B';
    return '#EF4444';
  }

  function scoreEmoji(g) {
    return { A: '🌟', B: '👍', C: '💪', D: '🌱' }[g] || '💬';
  }

  function addHistory(recipe, label, score) {
    history.unshift({ recipe, label, score, time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) });
    if (history.length > 8) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const area = document.getElementById('historyArea');
    const list = document.getElementById('historyList');
    if (!history.length) { area.style.display = 'none'; return; }
    area.style.display = 'block';
    list.innerHTML = history.map((h, i) => '<div class="history-item" onclick="restoreHistory(' + i + ')"><span class="h-recipe">[R' + h.recipe + ']</span><span class="h-q">' + h.label + '</span><span style="color:' + scoreColor(h.score || 0) + ';font-weight:700;font-size:14px;">' + (h.score ? h.score + '점' : '생성') + '</span><span style="color:var(--grey-mid);font-size:13px;">' + h.time + '</span></div>').join('');
  }

  function restoreHistory(i) {
    const h = history[i];
    selectRecipe(h.recipe);
    if (!h.label.startsWith('[생성]')) {
      document.getElementById('questionInput').value = h.label;
      updateChar();
    }
  }

  // ── 프롬프트 업그레이드 3단계 ──
  let promptStepData = {};

  async function runAI() {
    const btn = document.getElementById('runBtn');
    const question = document.getElementById('questionInput').value.trim();
    const topic = document.getElementById('topicInput').value.trim();
    const promptEl = document.getElementById('promptInput');
    const promptText = promptEl ? promptEl.value.trim() : '';

    if (currentMode === 'feedback' && !question) { alert('질문을 먼저 입력해주세요!'); return; }
    if (currentMode === 'generate' && !topic) { alert('주제나 키워드를 입력해주세요!'); return; }
    if (currentMode === 'prompt' && !promptText) { alert('문장을 먼저 입력해주세요!'); return; }

    btn.disabled = true;

    if (currentMode === 'prompt') {
      promptStepData = { original: promptText };
      document.getElementById('promptInputWrap').style.display = 'none';
      document.getElementById('promptStepsWrap').style.display = 'block';
      document.getElementById('originalPromptDisplay').textContent = promptText;
      btn.style.display = 'none';
      await runPromptStep(1, promptText);
    } else {
      showLoading();
      try {
        const body = { recipe: currentRecipe, mode: currentMode };
        if (currentMode === 'feedback') body.question = question;
        else body.topic = topic;
        const res = await fetch(API_BASE + '/api/coach', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) { const err = await res.json(); throw new Error(err.error || '서버 오류'); }
        const { result } = await res.json();
        if (currentMode === 'feedback') { renderFeedback(result, question); addHistory(currentRecipe, question, result.score); }
        else { renderGenerated(result, topic); addHistory(currentRecipe, '[생성] ' + topic, null); }
      } catch (e) {
        document.getElementById('resultContent').innerHTML = '<div style="padding:28px;color:#EF4444;text-align:center;font-size:18px;">⚠️ 오류가 발생했습니다.<br><small>' + e.message + '</small></div>';
      }
    }
    btn.disabled = false;
  }

  async function runPromptStep(step, inputSentence) {
    const stepContent = document.getElementById('stepContent');
    updateStepBar(step);
    stepContent.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>AI가 ' + step + '단계를 준비 중이에요…</p></div>';

    const stepPrompts = {
      1: '당신은 AI 프롬프트 교육 코치입니다. 한국 중학생 대상입니다.\n\n학생의 원래 문장: "' + inputSentence + '"\n\n[1단계: 명확성 높이기]\n이 문장에서 대상/범위/종류가 불분명한 부분을 찾아 명확하게 만든 버전 3개를 제안해주세요.\n\nJSON으로만 응답:\n{"explanation":"명확성이란 대상과 범위를 분명히 하는 것입니다. 예시 1문장","problem":"원래 문장에서 불명확한 점 1문장","options":["명확하게 바꾼 버전1","명확하게 바꾼 버전2","명확하게 바꾼 버전3"]}',
      2: '당신은 AI 프롬프트 교육 코치입니다. 한국 중학생 대상입니다.\n\n1단계 완성 문장: "' + inputSentence + '"\n\n[2단계: 구체성 높이기]\n이 문장에 숫자, 조건, 형식 등을 추가해 더 구체적으로 만든 버전 3개를 제안해주세요.\n\nJSON으로만 응답:\n{"explanation":"구체성이란 원하는 내용을 세밀하게 표현하는 것입니다. 예시 1문장","problem":"현재 문장에서 더 구체화할 수 있는 점 1문장","options":["구체적으로 바꾼 버전1","구체적으로 바꾼 버전2","구체적으로 바꾼 버전3"]}',
      3: '당신은 AI 프롬프트 교육 코치입니다. 한국 중학생 대상입니다.\n\n2단계 완성 문장: "' + inputSentence + '"\n\n[3단계: 목적 추가하기]\n이 문장에 왜 필요한지, 어떻게 사용할지 목적을 추가한 버전 3개를 제안해주세요.\n\nJSON으로만 응답:\n{"explanation":"목적을 추가하면 AI가 더 정확한 답을 줄 수 있습니다. 예시 1문장","problem":"현재 문장에 목적이 빠진 이유 1문장","options":["목적 추가한 버전1","목적 추가한 버전2","목적 추가한 버전3"]}'
    };

    try {
      const res = await fetch(API_BASE + '/api/coach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'prompt_analyze', systemPrompt: stepPrompts[step] })
      });
      if (!res.ok) throw new Error('서버 오류');
      const { result } = await res.json();
      renderStepUI(step, result, inputSentence);
    } catch (e) {
      stepContent.innerHTML = '<div style="padding:20px;color:#EF4444;text-align:center;font-size:17px;">⚠️ 오류: ' + e.message + '</div>';
    }
  }

  function renderStepUI(step, d, inputSentence) {
    const colors = { 1: '#1D4ED8', 2: '#7C3AED', 3: '#059669' };
    const bgs = { 1: '#EFF6FF', 2: '#F5F3FF', 3: '#ECFDF5' };
    const labels = { 1: '① 명확하게', 2: '② 구체적으로', 3: '③ 목적 분명히' };
    const c = colors[step], bg = bgs[step];

    const optionsHtml = d.options.map((opt, i) =>
      '<div onclick="selectStepOption(' + step + ', \'' + opt.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')" ' +
      'style="cursor:pointer;border:2.5px solid ' + c + '40;border-radius:14px;padding:18px 22px;margin-bottom:12px;font-size:17px;color:var(--navy);line-height:1.7;background:white;transition:all 0.15s;" ' +
      'onmouseover="this.style.background=\'' + bg + '\';this.style.borderColor=\'' + c + '\'" ' +
      'onmouseout="this.style.background=\'white\';this.style.borderColor=\'' + c + '40\'">' +
      '<span style="font-weight:700;color:' + c + ';">선택지 ' + (i + 1) + '</span><br>' + opt + '</div>'
    ).join('');

    document.getElementById('stepContent').innerHTML =
      '<div style="background:' + bg + ';border-radius:14px;padding:20px 24px;margin-bottom:20px;">' +
      '<div style="font-size:20px;font-weight:900;color:' + c + ';margin-bottom:8px;">' + labels[step] + '</div>' +
      '<div style="font-size:16px;color:var(--navy-mid);margin-bottom:6px;">💡 ' + d.explanation + '</div>' +
      '<div style="font-size:15px;color:#EF4444;">⚠️ ' + d.problem + '</div></div>' +
      '<div style="font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px;">아래 중 마음에 드는 문장을 선택하세요 👇</div>' +
      optionsHtml;
  }

  function selectStepOption(step, selected) {
    promptStepData['step' + step] = selected;
    if (step < 3) {
      document.getElementById('stepContent').innerHTML =
        '<div style="background:#ECFDF5;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">' +
        '<span style="font-size:24px;">✅</span>' +
        '<div><div style="font-size:15px;font-weight:700;color:#059669;">' + step + '단계 완료!</div>' +
        '<div style="font-size:17px;color:var(--navy);margin-top:4px;">' + selected + '</div></div></div>' +
        '<button onclick="runPromptStep(' + (step+1) + ', \'' + selected.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')" ' +
        'style="width:100%;padding:18px;background:var(--mint);color:white;border:none;border-radius:12px;font-size:19px;font-weight:700;cursor:pointer;">다음 단계로 →</button>';
      updateStepBar(step + 1);
    } else {
      renderFinalPrompt(selected);
    }
  }

  function renderFinalPrompt(final) {
    updateStepBar(4);
    document.getElementById('stepContent').innerHTML =
      '<div style="background:#ECFDF5;border-radius:14px;padding:24px;margin-bottom:16px;">' +
      '<div style="font-size:22px;font-weight:900;color:#059669;margin-bottom:20px;">🎉 프롬프트 업그레이드 완료!</div>' +

      '<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:var(--grey-mid);margin-bottom:6px;">📝 원래 문장</div>' +
      '<div style="font-size:17px;color:var(--navy-mid);padding:12px 16px;background:var(--grey-light);border-radius:10px;">' + promptStepData.original + '</div></div>' +

      '<div style="text-align:center;font-size:20px;color:var(--grey-mid);margin:8px 0;">↓</div>' +

      '<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#1D4ED8;margin-bottom:6px;">① 명확하게</div>' +
      '<div style="font-size:17px;color:var(--navy);padding:12px 16px;background:#EFF6FF;border-radius:10px;">' + (promptStepData.step1 || '') + '</div></div>' +

      '<div style="text-align:center;font-size:20px;color:var(--grey-mid);margin:8px 0;">↓</div>' +

      '<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:#7C3AED;margin-bottom:6px;">② 구체적으로</div>' +
      '<div style="font-size:17px;color:var(--navy);padding:12px 16px;background:#F5F3FF;border-radius:10px;">' + (promptStepData.step2 || '') + '</div></div>' +

      '<div style="text-align:center;font-size:20px;color:var(--grey-mid);margin:8px 0;">↓</div>' +

      '<div style="margin-bottom:20px;"><div style="font-size:13px;font-weight:700;color:#059669;margin-bottom:6px;">③ 목적까지 분명하게 ⭐ 최종 완성!</div>' +
      '<div style="font-size:19px;font-weight:700;color:#065F46;padding:16px 20px;background:white;border:3px solid #059669;border-radius:12px;">' + final + '</div></div>' +

      '<div style="padding:14px 18px;background:var(--yellow-light);border-radius:12px;font-size:17px;color:#7A6000;">💬 처음보다 훨씬 좋은 프롬프트가 됐어요! AI도 이런 질문을 더 좋아한답니다 😊</div></div>' +

      '<button onclick="resetPromptMode()" style="width:100%;padding:16px;background:var(--navy);color:white;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;">🔄 새 문장으로 다시 시작하기</button>';
  }

  function updateStepBar(activeStep) {
    const bgs = { 1: '#EFF6FF', 2: '#F5F3FF', 3: '#ECFDF5' };
    const cols = { 1: '#1D4ED8', 2: '#7C3AED', 3: '#059669' };
    [1, 2, 3].forEach(i => {
      const bar = document.getElementById('stepBar' + i);
      if (!bar) return;
      if (i < activeStep) { bar.style.background = '#ECFDF5'; bar.style.color = '#059669'; }
      else if (i === activeStep) { bar.style.background = bgs[i]; bar.style.color = cols[i]; }
      else { bar.style.background = 'var(--grey-light)'; bar.style.color = 'var(--grey-mid)'; }
    });
  }

  function resetPromptMode() {
    document.getElementById('promptInputWrap').style.display = 'block';
    document.getElementById('promptStepsWrap').style.display = 'none';
    document.getElementById('promptInput').value = '';
    document.getElementById('promptCharCount').textContent = '0';
    document.getElementById('runBtn').style.display = 'inline-flex';
    promptStepData = {};
  }

  function renderFeedback(d, q) {
    const sc = scoreColor(d.score);
    const em = scoreEmoji(d.grade);
    let extraHtml = '';
    if (currentRecipe === 2 && d.whyChain) {
      extraHtml = '<div class="feedback-section fb-improve"><div class="fb-head">🔗 왜? 연쇄 흐름</div><div class="fb-body">' + d.whyChain.map((w, i) => '<div style="margin-bottom:7px;padding-left:' + (i * 18) + 'px;">' + (i > 0 ? '↳ ' : '') + w + '</div>').join('') + '</div></div>';
    }
    if (currentRecipe === 3 && d.matrixRow) {
      const lc = d.matrixLevel === '심화' ? '#059669' : d.matrixLevel === '중급' ? '#0EA5A0' : '#F59E0B';
      extraHtml = '<div style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><span style="font-size:16px;font-weight:700;color:var(--navy-mid);">매트릭스 위치:</span><span style="background:var(--navy);color:white;padding:5px 14px;border-radius:20px;font-size:15px;font-weight:700;">' + d.matrixRow + '</span><span style="color:var(--grey-mid);">×</span><span style="background:var(--navy);color:white;padding:5px 14px;border-radius:20px;font-size:15px;font-weight:700;">' + d.matrixCol + '</span><span style="background:' + lc + ';color:white;padding:5px 14px;border-radius:20px;font-size:15px;font-weight:700;">📊 ' + d.matrixLevel + '</span></div>';
    }
    if (currentRecipe === 4 && d.questionType) {
      const isOpen = d.questionType.includes('잘 열린');
      const isHalf = d.questionType.includes('반쯤');
      const tc = isOpen ? '#059669' : isHalf ? '#F59E0B' : '#EF4444';
      extraHtml = '<div style="margin-bottom:14px;"><span style="background:' + tc + '20;color:' + tc + ';padding:6px 16px;border-radius:20px;font-size:16px;font-weight:700;border:2px solid ' + tc + '40;">🔓 ' + d.questionType + '</span></div>';
    }
    document.getElementById('resultContent').innerHTML =
      '<div class="result-header"><h3>📊 AI 코치 피드백</h3></div>' +
      '<div class="score-ring"><div class="score-circle" style="background:' + sc + '20;color:' + sc + ';border-color:' + sc + ';">' + d.score + '</div><div class="score-text"><strong>' + em + ' ' + d.gradeLabel + '</strong>레시피 ' + currentRecipe + ' 기준 · ' + d.grade + '등급</div></div>' +
      extraHtml +
      '<div class="feedback-section fb-good"><div class="fb-head">✅ 잘된 점</div><div class="fb-body">' + d.good + '</div></div>' +
      '<div class="feedback-section fb-improve"><div class="fb-head">💡 이렇게 발전시켜봐요</div><div class="fb-body">' + d.improve + '</div></div>' +
      '<div class="feedback-section fb-revised"><div class="fb-head">✨ 개선된 질문 예시</div><div class="fb-body">' + d.revised + '</div></div>' +
      '<div style="margin-top:14px;padding:14px 18px;background:var(--yellow-light);border-radius:12px;font-size:18px;color:#7A6000;">💬 ' + d.tip + '</div>';
  }

  function renderGenerated(d, topic) {
    let html = '<div class="result-header"><h3>✨ 생성된 질문들</h3></div>';
    if (currentRecipe === 1 && d.questions) {
      html += '<div class="feedback-section fb-generated"><div class="fb-head">🔀 레시피 1 · 5W1H+if 질문 조합</div><div class="fb-body">' + d.questions.map(q => '<div class="question-item"><span class="q-badge" style="background:var(--r1-light);color:var(--r1);">' + q.type + '</span><span class="q-text">' + q.q + '</span></div>').join('') + '</div></div>';
    }
    if (currentRecipe === 2 && d.whyChain) {
      html += '<div class="feedback-section fb-generated"><div class="fb-head">🔎 레시피 2 · 5-Why 연쇄 질문</div><div class="fb-body"><div class="question-item"><span class="q-badge" style="background:#EDE9FE;color:#7C3AED;">출발</span><span class="q-text">' + d.startQuestion + '</span></div>' + d.whyChain.map(w => '<div class="question-item"><span class="q-badge" style="background:var(--r2-light);color:var(--r2);">Why' + w.step + '</span><span class="q-text">' + w.q + '</span></div>').join('') + '</div></div><div style="padding:14px 18px;background:var(--yellow-light);border-radius:12px;font-size:18px;color:#7A6000;margin-top:10px;">💡 ' + d.insight + '</div>';
    }
    if (currentRecipe === 3 && d.questions) {
      html += '<div class="feedback-section fb-generated"><div class="fb-head">⊞ 레시피 3 · Q-Matrix 질문 조합</div><div class="fb-body">' + d.questions.map(q => '<div class="question-item"><span class="q-badge" style="background:var(--navy);color:white;">' + q.row + '</span><span class="q-badge" style="background:var(--grey-light);color:var(--navy-mid);">' + q.col + '</span><span class="q-text">' + q.q + '</span></div>').join('') + '</div></div>';
    }
    if (currentRecipe === 4 && d.closedExamples) {
      html += '<div class="feedback-section fb-generated"><div class="fb-head">🔓 레시피 4 · 닫힌 → 열린 질문 전환</div><div class="fb-body">' + d.closedExamples.map(ex => '<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--grey-light);"><div style="font-size:16px;color:#EF4444;margin-bottom:7px;">🔒 닫힌: ' + ex.closed + '</div><div style="font-size:18px;color:#059669;font-weight:500;">🔓 열린: ' + ex.open + '</div></div>').join('') + '<div style="padding:14px;background:var(--mint-light);border-radius:12px;font-size:18px;font-weight:700;color:var(--mint);">⭐ 최고의 열린 질문: ' + d.bestQuestion + '</div></div></div>';
    }
    if (d.tip) html += '<div style="padding:14px 18px;background:var(--yellow-light);border-radius:12px;font-size:18px;color:#7A6000;margin-top:10px;">💡 ' + d.tip + '</div>';
    document.getElementById('resultContent').innerHTML = html;
  }

  selectRecipe(1);
</script>
</body>
</html>
